name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Prefer in-repo fixture so type_fidelity does not depend on a sibling APK.
  ANDROGUARD_TEST_APK: ${{ github.workspace }}/testdata/classes4.dex

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets

      - name: Unit + integration tests
        run: cargo test --locked --all-targets --verbose

      - name: Decompiler fidelity suite
        # Explicit gate for fixture / source-fidelity / type-fidelity regressions.
        # type_fidelity uses testdata/classes4.dex when the sibling AndroguardTest APK
        # is not present (standalone CI clone).
        run: cargo test --locked --test decompiler_tests --verbose

      - name: Release binary builds
        run: cargo build --locked --release --bin dex-decompile

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warn-only: pre-existing dead_code noise must not block correctness CI.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -W clippy::all
